# Render Blueprint — one-click deploy of the Meridian API.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: meridian-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your MongoDB Atlas connection string in the Render dashboard.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # e.g. https://meridian.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
